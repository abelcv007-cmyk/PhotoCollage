# Configuración de Gradle para todo el proyecto.
# Los ajustes configurados desde Android Studio tienen prioridad sobre este archivo.

# Memoria para el proceso daemon de Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# La caché de configuración evita repetir la fase de configuración si los scripts no cambian.
org.gradle.configuration-cache=true

# Uso de las bibliotecas AndroidX.
android.useAndroidX=true

# Estilo de código Kotlin oficial.
kotlin.code.style=official

# La ruta del proyecto contiene caracteres no ASCII ("Fundación"). En Windows el
# Android Gradle Plugin bloquea la compilación en ese caso salvo que se permita aquí.
android.overridePathCheck=true
